<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>For Ashu ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;

      font-family: Arial, Helvetica, sans-serif;

      /*
      ============================
      BACKGROUND OPTIONS
      ============================

      OPTION 1 - Roses 🌹
      */

      background:
        linear-gradient(
          rgba(10, 3, 8, 0.42),
          rgba(10, 3, 8, 0.58)
        ),
        url("https://images.unsplash.com/photo-1494972308805-463bc619d34e?auto=format&fit=crop&w=2000&q=90")
        center / cover no-repeat;

      /*
      OPTION 2 - Purple flowers 💜

      Replace the background above with:

      background:
        linear-gradient(rgba(15,5,25,.45),rgba(5,2,15,.60)),
        url("https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=2000&q=90")
        center / cover no-repeat;


      OPTION 3 - Blue dreamy 🌙

      background:
        linear-gradient(rgba(2,8,25,.45),rgba(2,3,15,.65)),
        url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=90")
        center / cover no-repeat;
      */

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* Dark cinematic effect */

    body::after {
      content: "";
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle,
          transparent 25%,
          rgba(0,0,0,.55) 100%
        );

      pointer-events: none;
    }


    /* Sorry messages */

    #sorryContainer {
      position: fixed;
      inset: 0;

      z-index: 5;
    }


    .sorry {
      position: absolute;

      color: white;

      font-size: clamp(17px, 4vw, 25px);

      font-weight: 600;

      letter-spacing: .3px;

      white-space: nowrap;

      text-shadow:
        0 2px 10px rgba(0,0,0,.95);

      opacity: 0;

      animation:
        sorryAppear .45s ease forwards;
    }


    @keyframes sorryAppear {

      0% {
        opacity: 0;
        transform: scale(.65);
      }

      70% {
        transform: scale(1.08);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }

    }


    /* Final message */

    #finalMessage {

      display: none;

      position: relative;

      z-index: 20;

      width: 90%;

      max-width: 650px;

      text-align: center;

      color: white;

      animation:
        finalAppear 1.5s ease forwards;
    }


    #finalMessage h1 {

      margin: 0 0 25px;

      font-size: clamp(
        34px,
        9vw,
        62px
      );

      line-height: 1.15;

      text-shadow:
        0 4px 20px rgba(0,0,0,.9);
    }


    #finalMessage p {

      margin: 15px 0;

      font-size: clamp(
        21px,
        5vw,
        32px
      );

      font-weight: 500;

      text-shadow:
        0 3px 12px rgba(0,0,0,.9);
    }


    @keyframes finalAppear {

      0% {
        opacity: 0;
        transform: scale(.75);
        filter: blur(8px);
      }

      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }

    }


    .fadeOut {

      animation:
        fadeOut .8s ease forwards;
    }


    @keyframes fadeOut {

      to {
        opacity: 0;
        filter: blur(8px);
      }

    }

  </style>
</head>


<body>


  <div id="sorryContainer"></div>


  <div id="finalMessage">

    <h1>
      You are my best friend ❤️
    </h1>

    <p>
      You are my duo 🤝
    </p>

    <p>
      You are a diamond 💎
    </p>

    <p>
      Sorry for breaking your trust.
    </p>

  </div>


  <script>

    const container =
      document.getElementById("sorryContainer");

    const finalMessage =
      document.getElementById("finalMessage");


    /*
    =================================
    CREATE 50 SORRY MESSAGES
    =================================
    */

    const total = 50;


    /*
    Instead of completely random positions,
    we use a spaced layout.

    This prevents the words from merging
    together and keeps them readable.
    */


    setTimeout(() => {

      for (let i = 0; i < total; i++) {

        setTimeout(() => {

          const text =
            document.createElement("div");

          text.className = "sorry";

          text.textContent =
            "I'm sorry, Ashu";


          /*
          5 columns × 10 rows.

          A small random movement is added
          so it doesn't look like a boring grid.
          */

          const column = i % 5;

          const row =
            Math.floor(i / 5);


          let x =
            7 + column * 20;

          let y =
            7 + row * 9;


          /*
          Small random variation
          */

          x += (Math.random() * 6) - 3;
          y += (Math.random() * 4) - 2;


          text.style.left =
            x + "%";

          text.style.top =
            y + "%";


          container.appendChild(text);


        }, i * 60);

      }

    }, 1200);


    /*
    =================================
    SHOW FINAL MESSAGE
    =================================

    1.2 sec waiting
    + 3 sec for apologies
    + little pause
    = final message
    */


    setTimeout(() => {

      container.classList.add(
        "fadeOut"
      );


      setTimeout(() => {

        container.style.display =
          "none";

        finalMessage.style.display =
          "block";

      }, 800);


    }, 5300);

  </script>


</body>
</html>
